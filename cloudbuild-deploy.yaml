# Main deployment pipeline (system specification section 3.2).
steps:
  # Re-run both gates against the commit that reached main.
  - id: gitleaks-scan
    name: ghcr.io/gitleaks/gitleaks:v8.29.0
    entrypoint: /bin/sh
    env:
      - REPO_ROOT=/workspace
      - SECURITY_DIFF_RANGE=HEAD^..HEAD
      - DIFF_OUTPUT=/workspace/.security-diff.patch
      - CHANGED_FILES_OUTPUT=/workspace/.security-changed-files.txt
    args:
      - /workspace/scripts/security-gate/run_gitleaks.sh

  - id: vertex-ai-review
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir \
          --requirement scripts/security-gate/requirements.txt
        python scripts/security-gate/run_vertex_review.py \
          --project '${PROJECT_ID}' \
          --location '${_REGION}' \
          --model '${_AI_MODEL}' \
          --repo '${REPO_NAME}' \
          --diff-file /workspace/.security-diff.patch \
          --changed-files-file /workspace/.security-changed-files.txt \
          --prompt-file .security/vertex-ai-prompt.md \
          --output /workspace/.vertex-review.json

  # Specification 3.2 step 2: build and push a commit-addressable image.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - app/Dockerfile
      - --tag
      - ${_IMAGE_URI}
      - app

  - id: push-artifact-registry
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE_URI}

  # Specification 3.2 step 3: candidate receives no production traffic.
  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        access_flag='--no-allow-unauthenticated'
        if [[ '${_PUBLIC_ACCESS}' == 'true' ]]; then
          access_flag='--allow-unauthenticated'
        fi
        gcloud run deploy '${_SERVICE_NAME}' \
          --project='${PROJECT_ID}' \
          --region='${_REGION}' \
          --image='${_IMAGE_URI}' \
          --service-account='${_RUNTIME_SA}' \
          --no-traffic \
          --tag=candidate \
          "$${access_flag}" \
          --quiet

  # Specification 3.2 step 4: use the URL reported by Cloud Run, never guess it.
  - id: health-check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        candidate_url="$$(gcloud run services describe '${_SERVICE_NAME}' \
          --project='${PROJECT_ID}' \
          --region='${_REGION}' \
          --format="value(status.traffic[?tag='candidate'].url)")"
        if [[ -z "$${candidate_url}" ]]; then
          echo 'candidate tag URL was not reported by Cloud Run' >&2
          exit 1
        fi
        if [[ '${_PUBLIC_ACCESS}' == 'true' ]]; then
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$${candidate_url}/healthz"
        else
          service_url="$$(gcloud run services describe '${_SERVICE_NAME}' \
            --project='${PROJECT_ID}' \
            --region='${_REGION}' \
            --format='value(status.url)')"
          id_token="$$(gcloud auth print-identity-token --audiences="$${service_url}")"
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --header="Authorization: Bearer $${id_token}" \
            "$${candidate_url}/healthz"
        fi

  # Specification 3.2 step 5: promote only after the health check succeeds.
  - id: promote-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE_NAME}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --to-latest
      - --quiet

substitutions:
  _SERVICE_NAME: cicd-pilot-service
  _REGION: asia-east1
  _RUNTIME_SA: sa-cicd-pilot-service@taicca-geminiapi.iam.gserviceaccount.com
  _AI_MODEL: gemini-flash-latest
  _AR_REPOSITORY: cicd-services
  _PUBLIC_ACCESS: 'true'
  _IMAGE_URI: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s

