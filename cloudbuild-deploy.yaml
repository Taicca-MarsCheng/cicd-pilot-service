# Main deployment pipeline (system specification section 3.2).
steps:
  # Re-run both gates against the commit that reached main.
  - id: gitleaks-scan
    name: ghcr.io/gitleaks/gitleaks:v8.29.0
    entrypoint: /bin/sh
    env:
      - REPO_ROOT=/workspace
      # Cloud Build may provide a single-commit checkout. In that case the
      # gate safely scans the full repository snapshot from Git's empty tree.
      - DIFF_OUTPUT=/workspace/.security-diff.patch
      - CHANGED_FILES_OUTPUT=/workspace/.security-changed-files.txt
    args:
      - /workspace/scripts/security-gate/run_gitleaks.sh

  - id: vertex-ai-review
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir \
          --requirement scripts/security-gate/requirements.txt
        python scripts/security-gate/run_vertex_review.py \
          --project '${PROJECT_ID}' \
          --location '${_AI_LOCATION}' \
          --model '${_AI_MODEL}' \
          --repo '${REPO_NAME}' \
          --diff-file /workspace/.security-diff.patch \
          --changed-files-file /workspace/.security-changed-files.txt \
          --prompt-file .security/vertex-ai-prompt.md \
          --output /workspace/.vertex-review.json

  # Specification 3.2 step 2: build and push a commit-addressable image.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - app/Dockerfile
      - --tag
      - ${_IMAGE_URI}
      - app

  - id: push-artifact-registry
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE_URI}

  # Specification 3.2 step 3: existing services receive a 0%-traffic candidate.
  # Cloud Run's first revision is the bootstrap exception because --no-traffic
  # is unsupported while creating a service.
  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - /workspace/scripts/deploy/deploy_candidate.sh
      - ${PROJECT_ID}
      - ${_REGION}
      - ${_IMAGE_URI}
      - ${_RUNTIME_SA}
      - ${_SERVICE_NAME}
      - ${_PUBLIC_ACCESS}

  # Specification 3.2 step 4: use the URL reported by Cloud Run, never guess it.
  - id: health-check
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        service_json="$$(gcloud run services describe '${_SERVICE_NAME}' \
          --project='${PROJECT_ID}' \
          --region='${_REGION}' \
          --format=json)"
        if ! candidate_url="$$(printf '%s' "$${service_json}" | \
          python3 /workspace/scripts/deploy/select_traffic_url.py candidate)"; then
          echo 'candidate tag URL was not reported by Cloud Run' >&2
          exit 1
        fi
        if [[ '${_PUBLIC_ACCESS}' == 'true' ]]; then
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            "$${candidate_url}/health"
        else
          service_url="$$(gcloud run services describe '${_SERVICE_NAME}' \
            --project='${PROJECT_ID}' \
            --region='${_REGION}' \
            --format='value(status.url)')"
          id_token="$$(gcloud auth print-identity-token --audiences="$${service_url}")"
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --header="Authorization: Bearer $${id_token}" \
            "$${candidate_url}/health"
        fi

  # Specification 3.2 step 5: promote only after the health check succeeds.
  - id: promote-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE_NAME}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --to-latest
      - --quiet

substitutions:
  _SERVICE_NAME: cicd-pilot-service
  _REGION: asia-east1
  _RUNTIME_SA: sa-cicd-pilot-service@taicca-geminiapi.iam.gserviceaccount.com
  _AI_MODEL: gemini-3.1-flash-lite
  _AI_LOCATION: global
  _AR_REPOSITORY: cicd-services
  _PUBLIC_ACCESS: 'true'
  _IMAGE_URI: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_SERVICE_NAME}:${SHORT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
